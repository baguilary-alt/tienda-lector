<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lector de códigos de barras</title>
<style>
:root{font-family:Arial,sans-serif;color:#20312a;background:#f3f7f4}*{box-sizing:border-box}body{margin:0;padding:18px}.card{max-width:560px;margin:0 auto;background:white;border:1px solid #dce8df;border-radius:18px;padding:18px;box-shadow:0 8px 28px #183b2412}h1{font-size:22px;margin:0 0 8px;color:#246747}p{line-height:1.45;color:#52645a;font-size:14px}video{width:100%;max-height:55vh;background:#111;border-radius:12px;margin:12px 0;object-fit:cover}button,input{font:inherit;width:100%;padding:12px;border-radius:10px;margin:5px 0}button{border:0;background:#246747;color:white;font-weight:bold;cursor:pointer}.secondary{background:#edf4ef;color:#246747;border:1px solid #d4e4d9}.status{background:#edf4ef;padding:12px;border-radius:10px;font-size:14px;overflow-wrap:anywhere}.manual{margin-top:18px;padding-top:12px;border-top:1px solid #e1e9e4}label{font-size:13px;font-weight:bold}
</style>
</head>
<body><main class="card">
<h1>📷 Lector de códigos de barras</h1>
<p>Permite el acceso a la cámara y apunta al código de barras. Al detectarlo, el código se enviará a tu sistema de tienda.</p>
<button id="start">Activar cámara</button>
<video id="video" playsinline muted></video>
<div id="status" class="status">Pulsa “Activar cámara” para comenzar.</div>
<div class="manual"><label for="manualCode">Si la cámara no lee el código, escríbelo aquí:</label><input id="manualCode" inputmode="numeric" placeholder="Código de barras"><button class="secondary" id="send">Enviar código a la tienda</button></div>
<button class="secondary" id="back">Volver a la tienda</button>
</main>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
<script>
const params=new URLSearchParams(location.search);const target=params.get('target')||'producto';
const statusEl=document.getElementById('status'),video=document.getElementById('video');let reader=null,controls=null,busy=false;
function status(t){statusEl.textContent=t}
function sendCode(code){code=String(code||'').trim();if(!code){status('Ingresa o escanea un código válido.');return}if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'tienda-barcode-scanned',target,code},'*');status('Código enviado: '+code+'. Puedes volver a la pestaña de tu tienda.');stop();setTimeout(()=>window.close(),900)}else{document.getElementById('manualCode').value=code;status('Código leído: '+code+'. No se detectó la pestaña de la tienda; copia el código y vuelve a ingresarlo allí.')}}
function stop(){try{if(controls)controls.stop()}catch(e){}controls=null;try{if(reader)reader.reset()}catch(e){}reader=null;if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null}}
document.getElementById('start').addEventListener('click',async()=>{try{if(!window.ZXingBrowser)throw new Error('No cargó la biblioteca del lector. Revisa tu conexión y recarga.');stop();reader=new ZXingBrowser.BrowserMultiFormatReader();status('Solicitando permiso de cámara…');controls=await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},video,(result,err)=>{if(result&&!busy){busy=true;sendCode(result.getText())}});status('Cámara activa. Apunta al código de barras.')}catch(e){status('No se pudo abrir la cámara: '+(e.message||e)+'. Usa HTTPS y permite el acceso a la cámara en el navegador.');}});
document.getElementById('send').addEventListener('click',()=>sendCode(document.getElementById('manualCode').value));document.getElementById('manualCode').addEventListener('keydown',e=>{if(e.key==='Enter')sendCode(e.target.value)});document.getElementById('back').addEventListener('click',()=>{stop();if(window.opener&&!window.opener.closed)window.close();else history.back()});window.addEventListener('pagehide',stop);
</script></body></html>
