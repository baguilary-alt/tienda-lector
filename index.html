<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lector de códigos de barras</title>
<style>
body{font-family:Arial,sans-serif;color:#20312a;background:#f3f7f4;margin:0;padding:18px}
.card{max-width:560px;margin:auto;background:white;border:1px solid #dce8df;border-radius:18px;padding:18px}
button{width:100%;padding:14px;margin:8px 0;border:0;border-radius:10px;background:#246747;color:white;font-weight:bold;font-size:16px;cursor:pointer}
button.secondary{background:#edf5ef;color:#246747;border:1px solid #d1e3d5}
video{width:100%;background:#111;border-radius:12px;margin-top:8px}
input{box-sizing:border-box;width:100%;padding:12px;font-size:16px;border-radius:9px;border:1px solid #aaa}
.status{background:#edf5ef;padding:12px;border-radius:10px;margin:8px 0}
</style>
</head>
<body>
<main class="card">
<h2>📷 Lector de códigos de barras</h2>
<p>Activa la cámara y apunta al código de barras.</p>
<button id="start">Activar cámara</button>
<video id="video" playsinline muted></video>
<div id="status" class="status">Pulsa «Activar cámara» para comenzar.</div>
<p><b>Si no puedes escanear, escribe el código:</b></p>
<input id="manualCode" placeholder="Código de barras">
<button id="send" class="secondary">Enviar código a la tienda</button>
<button id="back" class="secondary">Volver a la tienda</button>
</main>

<script src="https://unpkg.com/@zxing/browser@0.1.5"></script>
<script>
const params = new URLSearchParams(location.search);
const target = params.get('target') || 'producto';
const video = document.getElementById('video');
const statusBox = document.getElementById('status');
let reader = null;

function status(text) {
  statusBox.textContent = text;
}

function sendCode(value) {
  const code = String(value || '').trim();
  if (!code) {
    status('Ingresa un código válido.');
    return;
  }

  if (window.opener && !window.opener.closed) {
    window.opener.postMessage({
      type: 'tienda-barcode-scanned',
      target: target,
      code: code
    }, '*');
    status('Código enviado. Puedes volver a tu tienda.');
  } else {
    status('No se encontró la ventana de la tienda. Código: ' + code);
    document.getElementById('manualCode').value = code;
  }
}

document.getElementById('start').onclick = async () => {
  try {
    if (!window.ZXingBrowser) {
      status('No se cargó el lector. Comprueba tu conexión y recarga la página.');
      return;
    }
    reader = new ZXingBrowser.BrowserMultiFormatReader();
    status('Solicitando acceso a la cámara...');
    await reader.decodeFromVideoDevice(
      undefined, video, (result, error) => {
        if (result) {
          sendCode(result.getText());
          reader.reset();
        }
      }
    );
    status('Cámara activa. Apunta al código de barras.');
  } catch (error) {
    status('Error de cámara: ' + (error.message || error));
  }
};

document.getElementById('send').onclick = () =>
  sendCode(document.getElementById('manualCode').value);

document.getElementById('manualCode').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendCode(e.target.value);
});

document.getElementById('back').onclick = () => {
  if (window.opener && !window.opener.closed) window.close();
  else history.back();
};
</script>
</body>
</html>
