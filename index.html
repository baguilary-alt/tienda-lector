
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lector de códigos de barras</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      color: #20312a;
      background: #f3f7f4;
      margin: 0;
      padding: 18px;
    }

    .card {
      max-width: 560px;
      margin: auto;
      background: white;
      border: 1px solid #dce8df;
      border-radius: 18px;
      padding: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 10px;
      background: #246747;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button.secondary {
      background: #edf5ef;
      color: #246747;
      border: 1px solid #d1e3d5;
    }

    video {
      display: block;
      width: 100%;
      min-height: 180px;
      background: #111;
      border-radius: 12px;
      margin-top: 8px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 9px;
      border: 1px solid #aaa;
    }

    .status {
      background: #edf5ef;
      padding: 12px;
      border-radius: 10px;
      margin: 8px 0;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="card">
    <h2>📷 Lector de códigos de barras</h2>
    <p>Activa la cámara y apunta al código de barras.</p>

    <button id="start">Activar cámara</button>
    <video id="video" playsinline muted></video>
    <div id="status" class="status">
      Pulsa «Activar cámara» para comenzar.
    </div>

    <p><b>Si no puedes escanear, escribe el código:</b></p>
    <input id="manualCode" placeholder="Código de barras"
           autocomplete="off" inputmode="numeric">

    <button id="send" class="secondary">Enviar código a la tienda</button>
    <button id="back" class="secondary">Volver a la tienda</button>
  </main>

  <script>
    // Cargar la biblioteca desde distintas fuentes si una falla.
    const libraryUrls = [
      "https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js",
      "https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"
    ];

    function loadLibrary(index = 0) {
      return new Promise((resolve, reject) => {
        if (window.ZXingBrowser) {
          resolve();
          return;
        }

        if (index >= libraryUrls.length) {
          reject(new Error("No se pudo cargar ZXing desde ninguna fuente."));
          return;
        }

        const script = document.createElement("script");
        script.src = libraryUrls[index];
        script.onload = () => {
          if (window.ZXingBrowser) resolve();
          else {
            script.remove();
            loadLibrary(index + 1).then(resolve).catch(reject);
          }
        };

        script.onerror = () => {
          script.remove();
          loadLibrary(index + 1).then(resolve).catch(reject);
        };

        document.head.appendChild(script);
      });
    }

    const params = new URLSearchParams(location.search);
    const target = params.get("target") || "producto";
    const video = document.getElementById("video");
    const statusBox = document.getElementById("status");
    const startButton = document.getElementById("start");

    let reader = null;
    let busy = false;

    function status(message) {
      statusBox.textContent = message;
    }

    function sendCode(value) {
      const code = String(value || "").trim();

      if (!code) {
        status("Ingresa o escanea un código válido.");
        return;
      }

      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({
          type: "tienda-barcode-scanned",
          target: target,
          code: code
        }, "*");

        status("Código enviado a la ventana de la tienda.");
      } else {
        document.getElementById("manualCode").value = code;
        status("Código leído: " + code +
          ". Abre el sistema de tienda para continuar.");
      }
    }

    async function stopCamera() {
      try {
        if (reader) reader.reset();
      } catch (e) {}

      reader = null;

      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }
    }

    startButton.addEventListener("click", async () => {
      if (busy) return;
      busy = true;
      startButton.disabled = true;

      try {
        status("Cargando lector de códigos...");
        await loadLibrary();

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "Este navegador no permite acceder a la cámara en esta página."
          );
        }

        status("Solicitando permiso para usar la cámara...");
        reader = new ZXingBrowser.BrowserMultiFormatReader();

        await reader.decodeFromVideoDevice(
          undefined,
          video,
          (result, error) => {
            if (result) {
              const code = result.getText();
              status("Código detectado: " + code);
              sendCode(code);
              stopCamera();
              startButton.disabled = false;
              busy = false;
            }
          }
        );

        status("Cámara activa. Apunta al código de barras.");
      } catch (error) {
        await stopCamera();
        status("No se pudo iniciar el lector: " +
          (error.message || String(error)));
        startButton.disabled = false;
        busy = false;
      }
    });

    document.getElementById("send").addEventListener("click", () => {
      sendCode(document.getElementById("manualCode").value);
    });

    document.getElementById("manualCode").addEventListener("keydown", e => {
      if (e.key === "Enter") sendCode(e.target.value);
    });

    document.getElementById("back").addEventListener("click", () => {
      if (window.opener && !window.opener.closed) {
        window.close();
      } else {
        history.back();
      }
    });

    loadLibrary()
      .then(() => status("Lector cargado. Pulsa «Activar cámara»."))
      .catch(() => status(
        "No se pudo cargar la biblioteca. Comprueba tu conexión e inténtalo de nuevo."
      ));
  </script>
</body>
</html>
